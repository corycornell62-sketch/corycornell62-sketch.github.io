<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucia — Panel Mode</title>
<style>
  :root { --scale: 1; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 30%, #2b2135 0%, #17121f 55%, #0b0810 100%);
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #cfc4de;
    user-select: none;
    -webkit-user-select: none;
  }
  .glow {
    position: fixed; inset: 0;
    background: radial-gradient(45% 55% at 50% 58%, rgba(155, 110, 220, .28) 0%, rgba(155, 110, 220, 0) 70%);
    pointer-events: none;
  }
  .stage {
    position: fixed; inset: 0;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .lucia-wrap {
    height: 96vh;
    aspect-ratio: 1 / 2;
    display: flex; align-items: flex-end; justify-content: center;
    transform: scale(var(--scale));
    transform-origin: 50% 100%;
    transition: transform .35s ease;
  }
  .lucia {
    height: 100%;
    animation: sway 6.5s ease-in-out infinite;
    filter: drop-shadow(0 18px 22px rgba(0,0,0,.55));
    cursor: pointer;
  }
  @keyframes sway {
    0%, 100% { transform: translateY(0) rotate(-0.55deg); }
    50% { transform: translateY(-1.1%) rotate(0.55deg); }
  }
  .lucia.wave { animation: wave .9s ease-in-out; }
  @keyframes wave {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(2.6deg) translateY(-1%); }
    60% { transform: rotate(-2.2deg) translateY(-.5%); }
  }
  .shadow {
    position: fixed; left: 50%; bottom: 2.2vh;
    width: 34vmin; height: 3.2vmin;
    transform: translateX(-50%);
    background: radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 70%);
    pointer-events: none;
  }
  .tag {
    position: fixed; top: 14px; left: 16px;
    font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
    opacity: .5; pointer-events: none;
  }
  .bar {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center;
    background: rgba(20, 14, 28, .72);
    border: 1px solid rgba(190, 160, 240, .25);
    border-radius: 999px; padding: 6px 10px;
    backdrop-filter: blur(6px);
  }
  .bar button {
    appearance: none; border: 1px solid rgba(190,160,240,.35);
    background: rgba(60, 42, 90, .55); color: #e9e2f5;
    font-size: 14px; line-height: 1;
    border-radius: 999px; padding: 8px 14px; cursor: pointer;
  }
  .bar button:active { background: rgba(110, 78, 170, .7); }
  .bar .lbl { font-size: 12px; opacity: .75; padding: 0 2px; }
</style>
</head>

<script>
  var root = document.documentElement;
  var scale = 1;
  function apply() { root.style.setProperty('--scale', scale.toFixed(2)); }
  document.getElementById('bigger').addEventListener('click', function () {
    scale = Math.min(1.35, scale + 0.1); apply();
  });
  document.getElementById('smaller').addEventListener('click', function () {
    scale = Math.max(0.55, scale - 0.1); apply();
  });
  var img = document.getElementById('lucia');
  function wave() {
    img.classList.remove('wave');
    void img.offsetWidth;
    img.classList.add('wave');
  }
  document.getElementById('waveBtn').addEventListener('click', wave);
  img.addEventListener('click', wave);
</script>
